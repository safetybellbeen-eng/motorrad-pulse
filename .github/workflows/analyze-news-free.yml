name: Analyze Motorcycle News FREE

# 완전 무료 운영 원칙: 외부 AI API를 전혀 사용하지 않는다.
# ANTHROPIC_API_KEY 등 어떠한 API Key도 필요하지 않다.
#
# 트리거 방식 (STEP 5):
# 1) workflow_dispatch — 기존과 동일하게 Actions 탭에서 수동으로 직접 실행 가능 (그대로 유지)
# 2) workflow_run — "Collect Motorcycle News"(collect-news.yml) 실행이 끝나면 자동으로 뒤이어 실행
#    completed는 성공/실패 모두에서 발생하므로, 아래 job의 if 조건에서
#    conclusion == 'success'인 경우에만 실제로 분석이 돌아가도록 제한한다.
#    (뉴스 수집이 실패했는데 분석까지 도는 일이 없도록 하는 안전장치)
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Collect Motorcycle News"]
    types:
      - completed

# 동시에 여러 개의 분석이 겹쳐 돌지 않도록 제한 (예: 수동 실행과 자동 실행이 겹치는 경우)
concurrency:
  group: motorrad-intelligence
  cancel-in-progress: false

# 분석 결과 JSON을 Repository에 다시 Commit해야 하므로 쓰기 권한 필요
permissions:
  contents: write

jobs:
  analyze-news-free:
    runs-on: ubuntu-latest
    # workflow_dispatch(수동 실행)로 왔을 때는 이 조건 자체가 평가되지 않고 항상 실행된다.
    # workflow_run(자동 실행)으로 왔을 때는 뉴스 수집이 성공(success)한 경우에만 실행된다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r scripts/requirements.txt

      - name: Run FREE rule-based analysis (no external AI API)
        run: python3 scripts/analyze_news_free.py

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- data/news.json data/insights.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No intelligence changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "motorrad-pulse-bot"
          git config user.email "actions@github.com"
          git add data/news.json data/insights.json
          git commit -m "auto: update MOTORRAD PULSE free intelligence"
          git push
